<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fbb-bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="fbb-grad-primary" x1="40" y1="30" x2="160" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="fbb-grad-accent" x1="70" y1="50" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="fbb-shadow" x="20" y="20" width="160" height="160" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="44" fill="url(#fbb-bg)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="168" height="168" rx="36" stroke="url(#fbb-grad-primary)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Main Bill Book Glyph -->
  <g filter="url(#fbb-shadow)">
    <!-- Book Backing Sheet -->
    <rect x="52" y="44" width="96" height="114" rx="14" fill="#1E293B" stroke="#334155" stroke-width="3"/>
    
    <!-- Main Receipt Body -->
    <rect x="62" y="38" width="86" height="114" rx="12" fill="url(#fbb-grad-primary)"/>
    
    <!-- Receipt Cut / Header Badge -->
    <rect x="74" y="48" width="40" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
    
    <!-- Item Lines -->
    <rect x="74" y="66" width="62" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="74" y="80" width="46" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.7"/>
    <rect x="74" y="94" width="54" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.7"/>
    
    <!-- Dividing Line -->
    <line x1="74" y1="108" x2="136" y2="108" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="3 3"/>
    
    <!-- Total Badge -->
    <rect x="74" y="118" width="62" height="18" rx="6" fill="#FFFFFF"/>
    
    <!-- Rupee / Check Glyph inside Total Badge -->
    <path d="M84 127H94M84 123H94M84 123V131M87.5 127L93 133" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="124" cy="127" r="4" fill="#10B981"/>
  </g>
  
  <!-- Friendly Sparkle Star -->
  <path d="M148 40L150.5 47.5L158 50L150.5 52.5L148 60L145.5 52.5L138 50L145.5 47.5L148 40Z" fill="#FBBF24"/>
</svg>
